<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Atendimento — Loja & Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F3F6;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --ink:#12151C;
  --muted:#667085;
  --muted-2:#98A2B3;
  --border:#E4E6EB;
  --navy:#0E1220;
  --navy-2:#171C2B;
  --red:#D2232A;
  --red-soft:#FCE8E8;
  --green:#1E9E64;
  --green-soft:#E7F7EF;
  --amber:#E2A034;
  --amber-soft:#FCF3E1;
  --blue:#2F6FED;
  --shopee:#EE4D2D;
  --ml:#E2B200;
  --magalu:#0086FF;
  --ativo:#8A5CF6;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,20,30,.04), 0 8px 24px -12px rgba(16,20,30,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Archivo',sans-serif;}

/* ---------- Header ---------- */
.topbar{background:var(--navy);color:#fff;padding:22px 28px 0;position:sticky;top:0;z-index:50;}
.topbar-inner{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;max-width:1360px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-size:16px;flex-shrink:0;}
.brand-text h1{font-family:'Archivo';font-weight:700;font-size:19px;margin:0;letter-spacing:-0.01em;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:#9AA3B8;}
.period-chip{font-family:'IBM Plex Mono';font-size:11.5px;color:#C7CCDA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;white-space:nowrap;}

/* date filter */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;margin-top:10px;}
.filterbar label{font-family:'Archivo';font-size:11px;font-weight:600;color:#9AA3B8;text-transform:uppercase;letter-spacing:.03em;}
.filterbar input[type=date]{font-family:'IBM Plex Mono';font-size:12.5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:7px;padding:5px 8px;color-scheme:dark;}
.filterbar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer;}
.fpreset{font-family:'Archivo';font-weight:600;font-size:11.5px;color:#C7CCDA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s;}
.fpreset:hover{background:rgba(255,255,255,.14);color:#fff;}
.fpreset.active{background:var(--red);border-color:var(--red);color:#fff;}
.fclear{font-family:'IBM Plex Mono';font-size:11px;color:#9AA3B8;background:transparent;border:none;cursor:pointer;text-decoration:underline;padding:4px 4px;}
.fcount{font-family:'IBM Plex Mono';font-size:11.5px;color:#C7CCDA;margin-left:auto;white-space:nowrap;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

.tabs{display:flex;gap:4px;max-width:1360px;margin:18px auto 0;overflow-x:auto;padding-bottom:0;}
.tab-btn{font-family:'Archivo';font-weight:600;font-size:13.5px;color:#9AA3B8;background:transparent;border:none;padding:11px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.15s;}
.tab-btn:hover{color:#fff;}
.tab-btn.active{color:#fff;border-bottom-color:var(--red);}

/* ---------- Layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:26px 28px 60px;}
.panel{display:none;}
.panel.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px;}
.section-title:first-child{margin-top:0;}
.section-title h2{font-family:'Archivo';font-weight:700;font-size:16px;margin:0;}
.section-title .idx{font-family:'IBM Plex Mono';color:var(--muted-2);font-size:12px;}
.section-sub{color:var(--muted);font-size:13px;margin:-8px 0 16px;}

.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.card h3{font-family:'Archivo';font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px;}

/* KPI card */
.kpi .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;}
.kpi .value{font-family:'Archivo';font-weight:800;font-size:30px;margin:6px 0 2px;letter-spacing:-0.01em;}
.kpi .delta{font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono';}
.kpi .delta.up{color:var(--red);}
.kpi .delta.down{color:var(--green);}
.kpi .delta.flat{color:var(--muted);}
.kpi .sub{font-size:12px;color:var(--muted-2);margin-top:2px;}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.g{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.dot.a{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
.dot.r{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.status-label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);}

.chart-card canvas{max-height:280px;}
.chart-tall canvas{max-height:340px;}

/* alert banner */
.banner{border-radius:var(--radius);padding:16px 20px;display:flex;gap:14px;align-items:flex-start;border:1px solid;margin-bottom:18px;}
.banner.crit{background:var(--red-soft);border-color:#F3C6C6;}
.banner.warn{background:var(--amber-soft);border-color:#F0DCA9;}
.banner .b-ico{font-family:'Archivo';font-weight:800;font-size:13px;color:#fff;background:var(--red);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.banner.warn .b-ico{background:var(--amber);}
.banner b{font-family:'Archivo';}
.banner p{margin:4px 0 0;font-size:13px;color:#3B3F4A;line-height:1.5;}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:'Archivo';font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:10px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
.bar-mini{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:4px;}
.bar-mini > div{height:100%;border-radius:3px;}
.rank-num{font-family:'IBM Plex Mono';color:var(--muted-2);width:18px;display:inline-block;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'Archivo';}
.pill.loja{background:var(--red-soft);color:var(--red);}
.pill.shopee{background:#FDEAE4;color:var(--shopee);}
.pill.ml{background:#FBF3D6;color:#9A7B00;}
.pill.magalu{background:#E3F1FF;color:var(--magalu);}
.pill.ativo{background:#F0E9FE;color:var(--ativo);}
.pill.hsn{background:#E1F5F2;color:var(--hsn, #0D9488);}

.subtabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.subtab-btn{font-family:'Archivo';font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);}
.subtab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.subpanel{display:none;}
.subpanel.active{display:block;}

.insight-list{margin:0;padding:0;list-style:none;}
.insight-list li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;}
.insight-list li:last-child{border-bottom:none;}
.insight-list .n{font-family:'IBM Plex Mono';color:var(--muted-2);font-size:11.5px;flex-shrink:0;padding-top:2px;}

.foot{text-align:center;color:var(--muted-2);font-size:11.5px;margin-top:40px;font-family:'IBM Plex Mono';}

.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.legend-sw{width:10px;height:10px;border-radius:3px;}
</style>
</head>

  if(h===null||h===undefined) return '—';
  const d = Math.floor(h/24); const rem = h - d*24;
  const hh2 = Math.floor(rem); const mm = Math.round((rem-hh2)*60);
  return (d>0? d+'d ':'') + String(hh2).padStart(2,'0')+'h'+String(mm).padStart(2,'0');
};
const CH_COLOR = {Loja:'#D2232A', Shopee:'#EE4D2D', 'Mercado Livre':'#C99A00', Magalu:'#0086FF', Ativo:'#8A5CF6', HSN:'#0D9488'};
const ORIGEM_COLOR = {
  Chat:'#D2232A', 'Formulário':'#2F6FED', WhatsApp:'#25D366', Telefone:'#F59E0B',
  'Redes sociais':'#EC4899', 'Reclame Aqui':'#7C3AED', GOV:'#64748B', 'E-mail':'#0EA5E9',
  Shopee:'#EE4D2D', 'Mercado Livre':'#C99A00', Magalu:'#0086FF', Ativo:'#8A5CF6',
};
const CH_PILL = {Loja:'loja', Shopee:'shopee', 'Mercado Livre':'ml', Magalu:'magalu', Ativo:'ativo', HSN:'hsn'};
const monthsOrder = ['Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto'];
const MONTH_RANGE = {
  Fevereiro:['2026-02-01','2026-02-28'], Março:['2026-03-01','2026-03-31'],
  Abril:['2026-04-01','2026-04-30'], Maio:['2026-05-01','2026-05-31'], Junho:['2026-06-01','2026-06-30'],
  Julho:['2026-07-01','2026-07-31'], Agosto:['2026-08-01','2026-08-31']
};
const ECOM_VALUES = ['Loja Ajinomoto','Marketplace','HSN'];
const ECOM_PILL = {'Loja Ajinomoto':'loja','Marketplace':'ml','HSN':'hsn'};
const DOW_ORDER = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DOW_MAP = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']; // JS getDay(): 0=Sun

function dot(status){ return `<span class="dot ${status}"></span>`; }
function statusFromTarget(value, meta, lowerIsBetter){
  if(value===null||value===undefined||meta===null||meta===undefined) return 'a';
  if(lowerIsBetter){
    if(value<=meta) return 'g';
    if(value<=meta*1.25) return 'a';
    return 'r';
  } else {
    if(value>=meta) return 'g';
    if(value>=meta*0.85) return 'a';
    return 'r';
  }
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function setPanel(id, html){ document.getElementById(id).innerHTML = html; }
function dowOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return DOW_MAP[new Date(y, m-1, d).getDay()];
}
function monthOverlaps(mes, start, end){
  const [ms, me] = MONTH_RANGE[mes];
  return ms <= end && me >= start;
}

function chart(ctx, config){ return new Chart(ctx, config); }
const FONT = "'Inter', sans-serif";
Chart.defaults.font.family = FONT;
Chart.defaults.color = '#667085';
Chart.defaults.font.size = 11.5;

/* ================= AGGREGATION ENGINE ================= */
const CHANNELS5 = ['Loja','Shopee','Mercado Livre','Magalu','Ativo','HSN'];
const CHANNELS4 = ['Loja','Shopee','Mercado Livre','Magalu']; // escopo original do dashboard "Loja & Marketplace"
const CHANNELS_DETAIL = ['Loja','Shopee','Mercado Livre','Magalu','HSN']; // usado em "Canais Individuais"
const RECLAM_SET = new Set(['Reclamação','Reclamação de experiência']);

function topN(map, n){
  return Object.fromEntries(Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n));
}
function inc(map,k){ map[k]=(map[k]||0)+1; }

function computeAggregates(startDate, endDate, ecom){
  let rows = (!startDate && !endDate) ? RAW.rows : RAW.rows.filter(r=> r[0]>=startDate && r[0]<=endDate);
  if(ecom && ecom!=='Todos') rows = rows.filter(r=> r[7]===ecom);
  const total_volume = rows.length;

  // weekly volume (chronological, only weeks present)
  const weekVol = {};
  rows.forEach(r=> inc(weekVol, r[1]));
  const weeksPresent = RAW.week_meta.filter(w=>weekVol[w]);
  const weekly_list = weeksPresent.map((w,i)=>{
    const volume = weekVol[w];
    const prev = i>0 ? weekVol[weeksPresent[i-1]] : null;
    const wow_pct = prev ? +(((volume-prev)/prev)*100).toFixed(1) : null;
    return {week_label:w, volume, wow_pct};
  });

  // monthly volume (cronológico, só meses presentes) — para destaques mensais
  const monthVol = {};
  rows.forEach(r=> inc(monthVol, r[2]));
  const monthsPresent = monthsOrder.filter(m=>monthVol[m]);
  const monthly_list = monthsPresent.map((m,i)=>{
    const volume = monthVol[m];
    const prev = i>0 ? monthVol[monthsPresent[i-1]] : null;
    const mom_pct = prev ? +(((volume-prev)/prev)*100).toFixed(1) : null;
    return {mes:m, volume, mom_pct};
  });

  // canal volume
  const canal_volume = {};
  rows.forEach(r=> inc(canal_volume, r[3]));
  const ranking_canais_detalhado = Object.entries(canal_volume)
    .map(([canal,volume])=>({canal, volume, pct: total_volume? +(volume/total_volume*100).toFixed(1) : 0}))
    .sort((a,b)=>b.volume-a.volume);

  // origem (Origem SAC) volume — usado no gráfico de participação percentual do painel Por Canal
  const origem_volume = {};
  rows.forEach(r=> inc(origem_volume, r[8]));
  const ranking_origem = Object.entries(origem_volume)
    .map(([origem,volume])=>({origem, volume, pct: total_volume? +(volume/total_volume*100).toFixed(1) : 0}))
    .sort((a,b)=>b.volume-a.volume);

  // canal por mes (todos os 5 meses sempre presentes no eixo)
  const canalMesMap = {};
  monthsOrder.forEach(m=> canalMesMap[m] = {mes:m});
  rows.forEach(r=>{
    const m = r[2], c = r[3];
    canalMesMap[m][c] = (canalMesMap[m][c]||0)+1;
  });
  const canal_mes_list = monthsOrder.map(m=>{
    const rec = {mes:m};
    CHANNELS5.forEach(c=> rec[c]=canalMesMap[m][c]||0);
    return rec;
  });

  // canal por semana (evolução semanal por canal, todas as semanas presentes)
  const canalSemanaMap = {};
  weeksPresent.forEach(w=> canalSemanaMap[w] = {week_label:w});
  rows.forEach(r=>{
    const w = r[1], c = r[3];
    canalSemanaMap[w][c] = (canalSemanaMap[w][c]||0)+1;
  });
  const canal_semana_list = weeksPresent.map(w=>{
    const rec = {week_label:w};
    CHANNELS5.forEach(c=> rec[c]=canalSemanaMap[w][c]||0);
    return rec;
  });

  // weekly_by_channel (canais detalhados: Loja/Shopee/ML/Magalu/HSN)
  const weekly_by_channel = {};
  CHANNELS_DETAIL.forEach(c=>{
    const map = {};
    rows.filter(r=>r[3]===c).forEach(r=>inc(map, r[1]));
    weekly_by_channel[c] = weeksPresent.filter(w=>map[w]).map(w=>({week_label:w, volume:map[w]}));
  });

  // monthly_by_channel
  const monthly_by_channel = {};
  CHANNELS_DETAIL.forEach(c=>{
    monthly_by_channel[c] = {};
    monthsOrder.forEach(m=> monthly_by_channel[c][m]=0);
  });
  rows.forEach(r=>{
    if(CHANNELS_DETAIL.includes(r[3])) monthly_by_channel[r[3]][r[2]]++;
  });

  // tipo_by_channel (top6)
  const tipo_by_channel = {};
  CHANNELS_DETAIL.forEach(c=>{
    const map = {};
    rows.filter(r=>r[3]===c).forEach(r=>inc(map, r[6]));
    tipo_by_channel[c] = topN(map,6);
  });

  // manifestacao_cross_by_channel: cruza Manifestação x Grupo x Tipo, top8 combinações por canal
  const manifestacao_cross_by_channel = {};
  CHANNELS_DETAIL.forEach(c=>{
    const map = {};
    rows.filter(r=>r[3]===c).forEach(r=>{
      const key = r[4]+'|||'+r[5]+'|||'+r[6];
      inc(map, key);
    });
    const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
    manifestacao_cross_by_channel[c] = entries.map(([key,count])=>{
      const [manifestacao,grupo,tipo] = key.split('|||');
      return {manifestacao, grupo, tipo, count};
    });
  });

  // top_grupo_canal_semana (top3 por semana, canais detalhados)
  const top_grupo_canal_semana = {};
  CHANNELS_DETAIL.forEach(c=>{
    top_grupo_canal_semana[c] = {};
    const byWeek = {};
    rows.filter(r=>r[3]===c).forEach(r=>{
      byWeek[r[1]] = byWeek[r[1]] || {};
      inc(byWeek[r[1]], r[5]);
    });
    weeksPresent.forEach(w=>{ if(byWeek[w]) top_grupo_canal_semana[c][w] = topN(byWeek[w],3); });
  });

  // dow_volume
  const dow_volume = {};
  DOW_ORDER.forEach(d=>dow_volume[d]=0);
  rows.forEach(r=> dow_volume[dowOf(r[0])]++ );

  // heatmap
  const heatMap = {};
  rows.forEach(r=>{
    const key = r[1]+'|'+dowOf(r[0]);
    heatMap[key] = (heatMap[key]||0)+1;
  });
  const heatmap_list = [];
  weeksPresent.forEach(w=> DOW_ORDER.forEach(d=>{
    const v = heatMap[w+'|'+d];
    if(v) heatmap_list.push({week_label:w, dow_pt:d, volume:v});
  }));

  // reclamacoes
  const grupoReclamMap = {}, tipoReclamMap = {};
  rows.filter(r=>RECLAM_SET.has(r[4])).forEach(r=>{ inc(grupoReclamMap, r[5]); inc(tipoReclamMap, r[6]); });
  const grupo_reclam = topN(grupoReclamMap, 8);
  const tipo_reclam = topN(tipoReclamMap, 8);

  // top day anomaly (dinâmico)
  const dayMap = {};
  rows.forEach(r=> inc(dayMap, r[0]));
  let top_day_anomaly = null;
  const dayEntries = Object.entries(dayMap);
  if(dayEntries.length){
    const [topDate, topCount] = dayEntries.sort((a,b)=>b[1]-a[1])[0];
    const topPct = +(topCount/total_volume*100).toFixed(1);
    if(topPct >= 15 && topCount >= 20){
      top_day_anomaly = {date:topDate, count:topCount, pct:topPct};
    }
  }

  // manual data filtrado por sobreposição de mês com o intervalo selecionado
  const inRange = (mes) => (!startDate && !endDate) || monthOverlaps(mes, startDate, endDate);
  const manual = {
    cr: RAW.manual.cr.filter(x=>inRange(x.mes)),
    nps: RAW.manual.nps.filter(x=>x.nps!==null && inRange(x.mes)),
    csat: RAW.manual.csat.filter(x=>inRange(x.mes)),
    sla: RAW.manual.sla.filter(x=>inRange(x.mes)),
    ra: RAW.manual.ra.filter(x=>inRange(x.mes)),
  };

  LAST_MONTH = manual.cr.length ? manual.cr[manual.cr.length-1].mes : null;
  PREV_MONTH = manual.cr.length>1 ? manual.cr[manual.cr.length-2].mes : null;

  return {
    total_volume, weekly_list, monthly_list, canal_volume, ranking_canais_detalhado, ranking_origem, canal_mes_list, canal_semana_list,
    weekly_by_channel, monthly_by_channel, tipo_by_channel, manifestacao_cross_by_channel,
    dow_volume, heatmap_list, grupo_reclam, tipo_reclam, top_day_anomaly, manual,
  };
}

function pct1(n){ return n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function emptyState(){ return `<div class="empty-state">Nenhum contato no período selecionado. Ajuste o filtro de datas no topo da página.</div>`; }
function manualScope(){
  // indicadores manuais (Dados manuais) são específicos por E-commerce:
  // Contact Rate, NPS e Nota RA (Loja Ajinomoto) -> Loja Ajinomoto
  // CSAT/Reputação/SLA Shopee, SLA Mercado Livre/Magalu -> Marketplace
  // SLA HSN -> HSN
  const ec = (typeof currentEcom!=='undefined') ? currentEcom : 'Todos';
  if(ec==='Todos') return {loja:true, shopee:true, hsn:true, ml:true, magalu:true};
  if(ec==='Loja Ajinomoto') return {loja:true, shopee:false, hsn:false, ml:false, magalu:false};
  if(ec==='Marketplace') return {loja:false, shopee:true, hsn:false, ml:true, magalu:true};
  return {loja:false, shopee:false, hsn:true, ml:false, magalu:false}; // HSN
}
function isFiltered(){
  const f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
  return !!(f || t) || (typeof currentEcom!=='undefined' && currentEcom!=='Todos');
}
function periodLabel(){
  const f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
  const fmtD = d => d.split('-').reverse().join('/');
  const ecomSuffix = (typeof currentEcom!=='undefined' && currentEcom!=='Todos') ? ` · ${currentEcom}` : '';
  if(!f && !t) return `06/02 – 31/08/2026 · ${fmt(DATA.total_volume)} contatos${ecomSuffix}`;
  return `${f?fmtD(f):'início'} – ${t?fmtD(t):'fim'} · ${fmt(DATA.total_volume)} contatos${ecomSuffix}`;
}

function renderExec(){
  if(DATA.total_volume===0){ setPanel('panel-exec', emptyState()); return; }
  const scope = manualScope();
  const cr = scope.loja ? DATA.manual.cr : [];
  const nps = scope.loja ? DATA.manual.nps : [];
  const sla = (scope.loja || scope.shopee) ? DATA.manual.sla : [];
  const crLast = cr.find(x=>x.mes===LAST_MONTH), crPrev = cr.find(x=>x.mes===PREV_MONTH);
  const npsLast = nps.find(x=>x.mes===LAST_MONTH), npsPrev = nps.find(x=>x.mes===PREV_MONTH);
  const slaLast = sla.find(x=>x.mes===LAST_MONTH);
  const noManualMsg = 'Indicador não se aplica ao E-commerce selecionado';

  const wk = DATA.weekly_list;
  const hasWeeks = wk.length>=2;

  const prevWeek = hasWeeks ? wk[wk.length-2] : null;

  const crStatus = crLast ? statusFromTarget(crLast.contact_rate*100, crLast.meta*100, true) : 'a';
  const npsStatus = npsLast ? statusFromTarget(npsLast.nps*100, npsLast.meta*100, false) : 'a';
  const slaStatus = (slaLast && scope.loja) ? statusFromTarget(slaLast.sla_loja_h, slaLast.sla_meta_h, true) : 'a';

  const anomalyBanner = DATA.top_day_anomaly ? (DATA.top_day_anomaly.date==='2026-04-22' ? `
  <div class="banner crit">

    </div>

    <div>

      <p>Esse dia responde por <b>${DATA.top_day_anomaly.count.toLocaleString('pt-BR')} contatos (${DATA.top_day_anomaly.pct}% do período selecionado)</b> — vale investigar a causa antes de tratar esse período como representativo.</p>
    </div>
  </div>`) : '';

  const html = `

  <div class="section-title"><span class="idx">5.3–5.4</span><h2>Visão geral do volume</h2></div>
  <div class="grid g4">
    <div class="card kpi">
      <h3>Volume total de contatos</h3>
      <div class="value">${fmt(DATA.total_volume)}</div>
      <div class="sub">${periodLabel()}</div>
    </div>
    <div class="card kpi">
      <div class="kpi-top"><h3>Semana mais recente</h3>${hasWeeks?dot(wkDelta===null?'a':(wkDelta<=0?'g':(wkDelta<15?'a':'r'))):''}</div>
      <div class="value">${lastWeek?fmt(lastWeek.volume):'—'}</div>
      ${hasWeeks && wkDelta!==null ? `<div class="delta ${wkDelta>0?'up':(wkDelta<0?'down':'flat')}">${wkDelta>0?'▲':'▼'} ${pct1(Math.abs(wkDelta))} vs. semana anterior</div>` : ''}
      <div class="sub">${lastWeek?lastWeek.week_label:''}${prevWeek?` · anterior ${prevWeek.week_label}: ${fmt(prevWeek.volume)}`:''}${isPartialLastWeek?' · semana parcial':''}</div>
    </div>
    <div class="card kpi">
      <div class="kpi-top"><h3>Contact Rate${LAST_MONTH&&scope.loja?` (${LAST_MONTH.slice(0,3)})`:''}</h3>${scope.loja?dot(crStatus):''}</div>
      <div class="value">${crLast?pct1(crLast.contact_rate*100):'—'}</div>
      <div class="sub">${crLast?`Meta ≤ ${pct0(crLast.meta*100)} · contatos/pedidos: ${fmt(crLast.total_contatos)}/${fmt(crLast.total_pedidos)}`:(scope.loja?'Sem dado manual no período selecionado':noManualMsg)}</div>
    </div>

      <div class="value">${(slaLast&&scope.hsn&&slaLast.sla_hsn_h!==null)?hh(slaLast.sla_hsn_h):'—'}</div>

  setPanel('panel-exec', html);

    const slaDatasets = [];

    if(scope.shopee) slaDatasets.push({label:'Shopee', data: sla.map(x=>x.sla_shopee_h), backgroundColor: CH_COLOR.Shopee, borderRadius:5, maxBarThickness:26});
    if(scope.hsn) slaDatasets.push({label:'HSN', data: sla.map(x=>x.sla_hsn_h), backgroundColor: CH_COLOR.HSN, borderRadius:5, maxBarThickness:26});

      type:'bar',
      data:{

    new Chart(document.getElementById('chartWeeklyExec'), {
      type:'bar',
      data:{

          label:'Volume semanal', data: wk.map(x=>x.volume),

      options:{

    });

}

/* ================= LOJA & MARKETPLACE ================= */
function renderLojaMkt(){
  if(DATA.total_volume===0){ setPanel('panel-lojamkt', emptyState()); return; }
  if(typeof currentEcom!=='undefined' && currentEcom==='HSN'){
    setPanel('panel-lojamkt', `<div class="empty-state">Este painel é definido para os canais Loja Ajinomoto, Shopee, Mercado Livre e Magalu — HSN não faz parte desse recorte. Troque o filtro de E-commerce para ver este painel, ou confira o HSN em "Canais Individuais".</div>`);
    return;
  }
  const canais4 = ['Loja','Shopee','Mercado Livre','Magalu'];
  const rk = DATA.ranking_canais_detalhado.filter(r=>canais4.includes(r.canal));
  const totalMkt = rk.reduce((s,r)=>s+r.volume,0);

  const kpiCards = rk.map(r=>`
    <div class="card kpi">
      <div class="kpi-top"><h3>${r.canal}</h3><span class="pill ${CH_PILL[r.canal]}">${pct1(totalMkt? r.volume/totalMkt*100 : 0)}</span></div>
      <div class="value">${fmt(r.volume)}</div>
      <div class="sub">volume de manifestações</div>
    </div>`).join('');

  // principais manifestações por canal — cruzamento Manifestação x Grupo x Tipo
  function manifestCrossTable(canal){
    const cross = DATA.manifestacao_cross_by_channel[canal]||[];
    const maxCross = cross.length? Math.max(...cross.map(c=>c.count)) : 1;
    const rowsHtml = cross.map(c=>`
      <tr>
        <td>${c.manifestacao}</td>
        <td>${c.grupo}</td>
        <td>${c.tipo}</td>
        <td class="num mono">${c.count}</td>
        <td style="width:100px"><div class="bar-mini"><div style="width:${c.count/maxCross*100}%;background:${CH_COLOR[canal]}"></div></div></td>
      </tr>`).join('') || `<tr><td colspan="5">Sem manifestações classificadas para este canal.</td></tr>`;
    return `<table><thead><tr><th>Manifestação</th><th>Grupo</th><th>Tipo</th><th class="num">Volume</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
  }

  const grupoSemanaBlocks = canais4.map(c=>`
    <div class="card">
      <h3><span class="pill ${CH_PILL[c]}">${c}</span> — principais manifestações</h3>
      <div style="margin-top:8px">${manifestCrossTable(c)}</div>
    </div>`).join('');

  // destaques da semana (última semana COMPLETA vs anterior, por canal — a última semana da base é parcial)
  const wkAll = DATA.weekly_list;
  const hasEnoughWeeks = wkAll.length>=3;
  const lastCompleteWeek = hasEnoughWeeks ? wkAll[wkAll.length-2].week_label : null;
  const prevCompleteWeek = hasEnoughWeeks ? wkAll[wkAll.length-3].week_label : null;
  function destaque(canal){
    if(!hasEnoughWeeks) return null;
    const wc = DATA.weekly_by_channel[canal] || [];
    const find = wl => (wc.find(x=>x.week_label===wl) || {volume:0}).volume;
    const last = {week_label:lastCompleteWeek, volume: find(lastCompleteWeek)};
    const prev = {week_label:prevCompleteWeek, volume: find(prevCompleteWeek)};
    const delta = prev.volume>0 ? ((last.volume-prev.volume)/prev.volume*100) : (last.volume>0 ? 100 : null);
    return {canal, last, prev, delta};
  }
  const destaques = canais4.map(destaque).filter(Boolean);
  const melhorias = destaques.filter(d=>d.delta!==null && d.delta<0).sort((a,b)=>a.delta-b.delta);
  const oportunidades = destaques.filter(d=>d.delta!==null && d.delta>0).sort((a,b)=>b.delta-a.delta);
  const estaveis = destaques.filter(d=>d.delta===0);

  const destaquesHtml = `
    ${hasEnoughWeeks?`<div class="section-sub" style="margin-top:-4px">Comparando as duas últimas semanas completas: ${prevCompleteWeek} → ${lastCompleteWeek}.</div>`:'<div class="section-sub" style="margin-top:-4px">Semanas insuficientes no período selecionado para comparar.</div>'}
    <div class="grid g2">
      <div class="card">
        <h3 style="color:var(--green)">Melhorias da semana (queda de volume)</h3>
        <ul class="insight-list">
          ${melhorias.length? melhorias.map(d=>`<li>${dot('g')}&nbsp; <b>${d.canal}</b> caiu ${pct1(Math.abs(d.delta))} (${d.prev.volume} → ${d.last.volume})</li>`).join('') : '<li>Nenhum canal com queda de volume na última semana completa.</li>'}
          ${estaveis.map(d=>`<li>${dot('g')}&nbsp; <b>${d.canal}</b> estável (${d.prev.volume} → ${d.last.volume})</li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <h3 style="color:var(--red)">Oportunidades de atenção (alta de volume)</h3>
        <ul class="insight-list">
          ${oportunidades.length? oportunidades.map(d=>`<li>${dot(d.delta>30?'r':'a')}&nbsp; <b>${d.canal}</b> subiu ${pct1(d.delta)} (${d.prev.volume} → ${d.last.volume})</li>`).join('') : '<li>Nenhum canal com alta relevante de volume na última semana completa.</li>'}
        </ul>
      </div>
    </div>`;

  const scope = manualScope();
  const cr = scope.loja ? DATA.manual.cr : [];
  const nps = scope.loja ? DATA.manual.nps : [];
  const csat = scope.shopee ? DATA.manual.csat : [];
  const sla = (scope.loja || scope.shopee || scope.hsn) ? DATA.manual.sla : [];
  const ra = scope.loja ? DATA.manual.ra : [];
  const noManualMsg = 'Indicador não se aplica ao E-commerce selecionado';

  const html = `
  <div class="section-title"><span class="idx">19–21</span><h2>Ranking Loja & Marketplaces</h2></div>
  <div class="section-sub">"Loja" soma Redes sociais, Formulário, WhatsApp, Telefone, Reclame Aqui, GOV e Chat, conforme definido. "Ativo" (contato proativo) é tratado à parte e não entra nesta soma.</div>
  <div class="grid g4">${kpiCards}</div>

  <div class="card chart-card" style="margin-top:14px">
    <h3>Volume de manifestações por canal — Loja, Shopee, Mercado Livre, Magalu</h3>
    <canvas id="chartLojaMktBar"></canvas>
  </div>

  <div class="section-title"><span class="idx">21</span><h2>Evolução semanal — Loja, Shopee, Mercado Livre, Magalu</h2></div>
  <div class="card chart-card chart-tall">
    ${DATA.weekly_list.length? '<canvas id="chartLojaMktSemana"></canvas>' : '<p class="section-sub">Nenhuma semana com dados no período selecionado.</p>'}
  </div>

  <div class="section-title"><span class="idx">21</span><h2>Principais manifestações por canal</h2></div>

  <div class="grid g2">${grupoSemanaBlocks}</div>

  <div class="section-title"><span class="idx">22</span><h2>Destaques da semana</h2></div>
  ${destaquesHtml}

  <div class="section-title"><span class="idx">23–29</span><h2>Indicadores de qualidade</h2></div>
  <div class="section-sub">Indicadores manuais (SLA, NPS, CSAT, Contact Rate) são lançados por mês — o gráfico mostra os meses que se sobrepõem ao período selecionado.</div>
  <div class="grid g4">
    <div class="card chart-card">
      <h3>SLA — Loja vs Shopee (meta 24h)</h3>
      ${sla.length? '<canvas id="chartSlaLM"></canvas>' : `<p class="section-sub">${(scope.loja||scope.shopee)?'Sem dado manual no período selecionado.':noManualMsg}</p>`}
    </div>
    <div class="card chart-card">
      <h3>NPS Loja vs meta (50%)</h3>

      ${cr.length? '<canvas id="chartCrLM"></canvas>' : `<p class="section-sub">${scope.loja?'Sem dado manual no período selecionado.':noManualMsg}</p>`}
    </div>
    <div class="card kpi">
      <h3>Reputação Shopee</h3>
      <div class="value">${csat.length?csat[csat.length-1].reputacao_shopee:'—'} <span style="font-size:15px;color:var(--muted-2)">/5</span></div>
      <div class="sub">${scope.shopee?'Estável em 4.9 desde abril':noManualMsg}</div>
    </div>
    <div class="card kpi">
      <h3>Reputação Magalu</h3>
      <div class="value">${(csat.length&&csat[csat.length-1].reputacao_magalu!==null)?csat[csat.length-1].reputacao_magalu:'—'} <span style="font-size:15px;color:var(--muted-2)">/5</span></div>
      <div class="sub">${scope.shopee?((csat.length&&csat[csat.length-1].reputacao_magalu!==null)?`1° registro em ${csat[csat.length-1].mes.slice(0,3)}`:'Sem nota registrada no período selecionado'):noManualMsg}</div>
    </div>
    <div class="card kpi">
      <h3>RA Reviews (estrelas)</h3>
      <div class="value">${csat.length?csat[csat.length-1].ra_reviews_loja:'—'} <span style="font-size:15px;color:var(--muted-2)">/5</span></div>
      <div class="sub">${scope.loja?`Loja ${csat.length?csat[csat.length-1].ra_reviews_loja:'—'}/5 · Produtos ${csat.length?csat[csat.length-1].ra_reviews_produtos:'—'}/5`:noManualMsg}</div>

      <div class="kpi-top"><h3>Nota Reclame Aqui (Loja Ajinomoto)</h3>${ra.length?dot(statusFromTarget(ra[ra.length-1].ra_loja_nota, 7, false)):''}</div>
      <div class="value">${ra.length&&ra[ra.length-1].ra_loja_nota!==null?ra[ra.length-1].ra_loja_nota.toFixed(1):'—'} <span style="font-size:15px;color:var(--muted-2)">/10</span></div>
      <div class="sub">${ra.length?`${ra[ra.length-1].ra_loja_qt} reclamações no RA em ${ra[ra.length-1].mes.slice(0,3)}`:noManualMsg}</div>

  `;
  setPanel('panel-lojamkt', html);

  new Chart(document.getElementById('chartLojaMktBar'), {

    data:{labels: rk.map(r=>r.canal), datasets:[{data: rk.map(r=>r.volume), backgroundColor: rk.map(r=>CH_COLOR[r.canal]), borderRadius:6, maxBarThickness:52}]},

  const cross = DATA.manifestacao_cross_by_channel[canal]||[];
  const maxCross = cross.length? Math.max(...cross.map(c=>c.count)) : 1;

  const crossRows = cross.map(c=>`

  const html = `

        <div class="sub">${pct1(volume/DATA.total_volume*100)} do volume total da base</div>

      ${npsHtml}
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Principais manifestações</h3>
      <div class="section-sub" style="margin:2px 0 8px">Cruzamento de Manifestação, Grupo e Tipo de Manifestação — combinações mais frequentes.</div>

      <div class="card chart-card">

      <div class="card chart-card">
        <h3>Evolução mensal</h3>

  const dow = DATA.dow_volume;

  const heatMap = {};
  DATA.heatmap_list.forEach(h=>{ heatMap[h.week_label+'|'+h.dow_pt] = h.volume; });
  const heatNonOutlier = DATA.heatmap_list.filter(h=>!(h.week_label==='Abr-S4'&&h.dow_pt==='Quarta')).map(h=>h.volume);

/* ================= INIT ================= */
let activeMainTab = 'exec';
let activeIndividualSub = 'Loja';

function initTabs(){
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeMainTab = btn.dataset.tab;
      applyActiveStates();
    });
  });
}
function applyActiveStates(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeMainTab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+activeMainTab));
  const subBtn = document.querySelector(`#panel-individual .subtab-btn[data-sub="${activeIndividualSub}"]`);
  if(subBtn){
    document.querySelectorAll('#panel-individual .subtab-btn').forEach(b=>b.classList.toggle('active', b===subBtn));
    document.querySelectorAll('#panel-individual .subpanel').forEach(p=>p.classList.toggle('active', p.id==='sub-'+activeIndividualSub.replace(/\s/g,'')));
  }
}

function renderAll(){
  renderExec();
  renderCanal();
  renderLojaMkt();
  renderIndividual();
  renderGestao();
  renderResumo();
  applyActiveStates();
}

/* ---------- filtro de data + e-commerce ---------- */
const DATA_MIN = '2026-02-01', DATA_MAX = '2026-08-31';
let currentEcom = 'Todos';

function refresh(){
  const f = document.getElementById('dateFrom').value || null;
  const t = document.getElementById('dateTo').value || null;
  DATA = computeAggregates(f, t, currentEcom);
  document.getElementById('periodChip').textContent = periodLabel();
  const totalAll = RAW.rows.length;
  const filtersOn = !!(f||t) || currentEcom!=='Todos';
  document.getElementById('fCount').textContent = filtersOn ? `${fmt(DATA.total_volume)} de ${fmt(totalAll)} contatos` : '';
  renderAll();
}

function setPreset(name){
  document.querySelectorAll('#filterbar .fpreset').forEach(b=>b.classList.toggle('active', b.dataset.preset===name));
  if(name==='all'){
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
  } else {
    const [s,e] = MONTH_RANGE[name];
    document.getElementById('dateFrom').value = (s<DATA_MIN)?DATA_MIN:s;
    document.getElementById('dateTo').value = (e>DATA_MAX)?DATA_MAX:e;
  }
  refresh();
}

function setEcom(name){
  currentEcom = name;
  document.querySelectorAll('#ecomFilterbar .fpreset').forEach(b=>b.classList.toggle('active', b.dataset.ecom===name));
  refresh();
}

function initFilter(){
  const dFrom = document.getElementById('dateFrom'), dTo = document.getElementById('dateTo');
  dFrom.min = DATA_MIN; dFrom.max = DATA_MAX; dTo.min = DATA_MIN; dTo.max = DATA_MAX;
  dFrom.addEventListener('change', ()=>{ document.querySelectorAll('#filterbar .fpreset').forEach(b=>b.classList.remove('active')); refresh(); });
  dTo.addEventListener('change', ()=>{ document.querySelectorAll('#filterbar .fpreset').forEach(b=>b.classList.remove('active')); refresh(); });
  document.querySelectorAll('#filterbar .fpreset').forEach(btn=>{
    btn.addEventListener('click', ()=> setPreset(btn.dataset.preset));
  });
  document.getElementById('fClear').addEventListener('click', ()=> setPreset('all'));
  document.querySelectorAll('#ecomFilterbar .fpreset').forEach(btn=>{
    btn.addEventListener('click', ()=> setEcom(btn.dataset.ecom));
  });
}

DATA = computeAggregates(null, null, 'Todos');
initTabs();
initFilter();
renderAll();
</script>
